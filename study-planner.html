<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Planner</title>
<style>
:root{--bg:#FCF8F9;--card:#fff;--ac:#E3A5B5;--soft:#F4C2C2;--tint:#FAF3F5;--line:#F2E5E9;--tx:#3F2D33;--mu:#A28C93;--sh:none}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Helvetica Neue",Arial,sans-serif;font-weight:400;-webkit-text-size-adjust:100%}
body{padding:max(20px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit;font-weight:400}
button{cursor:pointer;background:none;border:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:26px;font-weight:500;margin:6px 4px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:var(--sh)}
.bar{display:flex;align-items:center;gap:6px;padding:10px 14px;margin-bottom:18px;border-radius:24px}
.bar .nav{width:36px;height:36px;display:grid;place-items:center;color:var(--mu)}
.dt{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:10px;height:46px;border-radius:16px;background:var(--tint);font-size:17px}
.dt svg{color:var(--ac)}
.dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.today{color:var(--ac);font-size:24px;font-weight:500;padding:0 8px}
.grid{display:grid;gap:18px;grid-template-columns:1fr;align-items:start}
h2{font-size:19px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
h2 span{font-size:14px;color:var(--mu);font-weight:400}
/* timer */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:19px;font-weight:500;min-height:44px}
.fl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mu);font-weight:400}
.fl input{width:58px;height:42px;text-align:center;border:1px solid var(--line);border-radius:14px;background:var(--tint);font-size:16px}
.ring{position:relative;width:min(100%,290px);aspect-ratio:1;margin:18px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);stroke-width:4.5}
.ring .tr{stroke:var(--line)}.ring .pr{stroke:var(--ac);transition:stroke-dashoffset .3s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(36px,11vw,50px);font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tabs{display:flex;width:fit-content;max-width:100%;margin:0 auto;padding:5px;border-radius:18px;background:var(--tint)}
.tabs button{padding:10px 14px;border-radius:14px;font-size:15px;color:var(--mu);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--tx)}
.ctl{display:flex;justify-content:center;gap:12px;margin-top:20px}
.sq{width:56px;height:56px;border-radius:18px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ac);background:#fff}
.go{flex:1;max-width:200px;height:56px;border-radius:18px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:500}
.go svg{fill:currentColor;width:16px;height:16px}
/* timetable */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.chips button{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--tint);font-size:15px;white-space:nowrap}
.chips button:hover{background:var(--soft);color:#fff}
.row{background:var(--tint);border-radius:18px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:22px 1fr 38px;gap:8px 8px;align-items:center;border:1px solid transparent}
.row.cur{border-color:var(--ac)}.row.done{opacity:.5}
.row>b{font-size:14px;color:var(--mu);font-weight:400;text-align:center}
.row .nm{min-width:0;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:16px}
.x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mu);background:#fff;border:1px solid var(--line)}
.x svg{width:16px;height:16px}
.sts{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap}
.st{display:flex;align-items:center;justify-content:space-between;gap:4px;height:40px;padding:0 4px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;min-width:128px;flex:1}
.st button{width:30px;height:30px;font-size:18px;color:var(--ac)}
.sum{font-size:13px;color:var(--mu);margin-top:4px}
/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--tint);border-radius:20px;padding:16px}
.tile small{display:block;font-size:14px;color:var(--mu);margin-bottom:8px}
.tile b{font-size:30px;font-weight:500}.tile i{font-style:normal;font-size:16px;color:var(--mu)}
/* lists */
.add{display:flex;gap:10px;margin-bottom:12px}
.add input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:999px;padding:0 18px;font-size:16px;background:#fff}
.add button{width:48px;height:48px;border-radius:16px;background:var(--ac);color:#fff;display:grid;place-items:center}
ul{list-style:none;padding:0}
li{display:flex;align-items:center;gap:12px;padding:12px 2px;font-size:16px}
li+li{border-top:1px solid var(--line)}
li .t{flex:1;min-width:0;overflow-wrap:anywhere}
li .m{font-size:14px;color:var(--mu)}
li.dn .t{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--soft)}
.ck{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.ck svg{width:16px;height:16px}
.dn .ck,.hk{background:var(--ac);border-color:var(--ac)}
.hk{background:var(--tint);border:0;width:34px;height:34px;color:var(--ac)}
.tr2{color:var(--mu);width:34px;height:34px;display:grid;place-items:center}
/* photos */
.add-p{display:flex;align-items:center;justify-content:center;gap:10px;height:96px;border:1.5px dashed var(--line);border-radius:20px;color:var(--mu);cursor:pointer;font-size:16px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ph div{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--tint)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--tx)}
.ph button svg{width:14px;height:14px}
@media(min-width:768px){body{padding:32px}.grid{grid-template-columns:repeat(2,1fr);gap:22px}h1{font-size:30px}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <h1 id="ttl"></h1>
 <div class="card bar">
  <button class="nav" data-a="prev" aria-label="이전 날"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <label class="dt"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span id="dl"></span><input type="date" id="dp"></label>
  <button class="nav" data-a="next" aria-label="다음 날"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="today" data-a="today" aria-label="오늘">♡</button>
 </div>

 <main class="grid">
  <section class="card">
   <div class="top"><span id="lbl"></span><label class="fl" id="flw">Focus length <input id="fl" type="number" min="1" max="180" inputmode="numeric"> min</label></div>
   <div class="ring"><svg viewBox="0 0 300 300"><circle class="tr" cx="150" cy="150" r="130"/><circle class="pr" id="pr" cx="150" cy="150" r="130" stroke-linecap="round" stroke-dasharray="816.8" stroke-dashoffset="816.8"/></svg><b id="time">00:00</b></div>
   <div class="tabs" id="tabs"><button data-a="mode" data-v="focus">Focus</button><button data-a="mode" data-v="short">Short break</button><button data-a="mode" data-v="long">Long break</button></div>
   <div class="ctl">
    <button class="sq" data-a="reset" aria-label="초기화"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg></button>
    <button class="go" id="pp" data-a="toggle"></button>
    <button class="sq" data-a="skip" aria-label="건너뛰기"><svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7zM19 5v14"/></svg></button>
   </div>
  </section>

  <section class="card">
   <h2>Timetable <span id="sum"></span></h2>
   <div class="chips" id="chips"></div>
   <div id="plan"></div>
  </section>

  <section class="card">
   <h2>Day's progress</h2>
   <div class="tiles"><div class="tile"><small>Focused time</small><b id="n1">0m</b></div><div class="tile"><small>Completed</small><b id="n2">0</b> <i>blocks</i></div></div>
  </section>

  <section class="card">
   <h2>For this day <span id="tc"></span></h2>
   <div class="add"><input id="tk" placeholder="Add a task" maxlength="60" autocomplete="off"><button data-a="addT" aria-label="추가"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>
   <ul id="tasks"></ul>
  </section>

  <section class="card">
   <h2>Photos <span id="pc"></span></h2>
   <label class="add-p"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>Add a photo<input id="pf" type="file" accept="image/*" multiple hidden></label>
   <div class="ph" id="ph"></div>
  </section>

  <section class="card">
   <h2>Session history <span id="hc"></span></h2>
   <ul id="hist"></ul>
  </section>
 </main>
</div>

<script>
const K='studyplanner.v2',SUBS=['국어','수학','영어','한국사','탐구','과학','사회'];
let S;try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){S={}}
S.days=S.days||{};S.fl=S.fl||30;S.mode=S.mode||'focus';
S.timer=S.timer||{day:null,idx:0,rem:0,running:false,endAt:0};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dayOf=t=>key(new Date(t-6*36e5)); // 매일 06:00 기준 하루
const D=k=>S.days[k]||(S.days[k]={plan:[],tasks:[],hist:[]});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const shift=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const fmtT=t=>{const d=new Date(t),h=d.getHours();return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+pad(d.getMinutes())};
const fmtM=m=>m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m';
const IC={x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',ck:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',tr:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',play:'<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></svg>'};
let view=dayOf(Date.now()),actx=null;

function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
 [660,880].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);
 const s=t+i*.35;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.12,s+.05);g.gain.exponentialRampToValueAtTime(.001,s+.9);o.start(s);o.stop(s+1)})}catch(e){}}

/* 시간표 → 세션 목록 (집중 → 휴식 순서). 시간표가 비어 있으면 선택한 탭의 단일 세션 */
function sessions(day){
 const p=D(day).plan;
 if(p.length)return p.flatMap((r,i)=>[{type:'focus',sub:r.sub,min:r.f,row:i}].concat(r.b>0?[{type:'break',sub:'',min:r.b,row:i}]:[]));
 return [{type:S.mode==='focus'?'focus':'break',sub:'',min:S.mode==='focus'?S.fl:S.mode==='short'?5:15,row:-1}];
}
const cur=()=>{const T=S.timer;return T.day?sessions(T.day)[T.idx]||null:null};

function finish(at){
 const T=S.timer,s=cur();
 if(s.type==='focus')D(dayOf(at)).hist.push({sub:s.sub,min:s.min,at});
 T.idx++;T.rem=0;
 const n=cur();
 if(n)T.endAt=at+n.min*6e4;else T.running=false; // 다음 세션으로 자동 진행
 if(Date.now()-at<4000)beep();
}
function tick(){
 const T=S.timer;if(!T.running)return;let ch=false;
 while(T.running&&Date.now()>=T.endAt){finish(T.endAt);ch=true}
 if(ch){save();render()}
 paint();
}
function toggle(){
 const T=S.timer;
 if(!T.running){
  if(!cur()){T.day=view;T.idx=0;T.rem=0}
  const s=cur();if(!s)return;
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  T.endAt=Date.now()+(T.rem||s.min*6e4);T.running=true;
 }else{T.rem=T.endAt-Date.now();T.running=false}
 save();render();
}
function skip(){
 const T=S.timer;if(!cur())return;
 T.idx++;T.rem=0;const n=cur();
 if(n&&T.running)T.endAt=Date.now()+n.min*6e4;else if(!n)T.running=false;
 save();render();
}
function reset(){S.timer={day:null,idx:0,rem:0,running:false,endAt:0};save();render()}
const idle=()=>{if(!S.timer.running){S.timer.rem=0;if(!D(S.timer.day||view).plan.length)S.timer.day=null}};

function paint(){
 const T=S.timer,s=cur()||sessions(view)[0];
 let tot=s?s.min*6e4:0,ms=tot;
 if(cur())ms=T.running?Math.max(0,T.endAt-Date.now()):(T.rem||tot);
 const sec=Math.ceil(ms/1000),txt=pad(Math.floor(sec/60))+':'+pad(sec%60);
 $('time').textContent=txt;
 $('pr').style.strokeDashoffset=tot?816.8*(ms/tot):816.8;
 document.title=(T.running?txt+' · ':'')+'Study Planner';
}

function render(){
 const T=S.timer,d=D(view),dt=parse(view),W='일월화수목금토'[dt.getDay()];
 $('ttl').textContent=`${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 ${W}요일`;
 $('dl').textContent=`${dt.getFullYear()}. ${dt.getMonth()+1}. ${dt.getDate()}.`;
 $('dp').value=view;
 const s=cur()||sessions(view)[0],auto=d.plan.length>0;
 $('lbl').textContent=s.type==='focus'?(s.sub||'Focus'):(auto?'Break':S.mode==='long'?'Long break':'Short break');
 $('pp').innerHTML=(T.running?IC.pause+'Pause':IC.play+'Start');
 const act=s.type==='focus'?'focus':(auto?'short':S.mode);
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===act));
 $('fl').value=S.fl;$('flw').style.visibility=auto?'hidden':'visible';

 $('chips').innerHTML=SUBS.map(x=>`<button data-a="addS" data-v="${x}">${x}</button>`).join('')+'<button data-a="addS" data-v="">+</button>';
 const cs=T.day===view&&cur()?cur().row:-2,over=T.day===view&&!cur()&&T.idx>0;
 $('plan').innerHTML=d.plan.map((r,i)=>`<div class="row ${cs===i?'cur':''} ${(over||(cs>=0&&i<cs))?'done':''}"><b>${i+1}</b><input class="nm" data-a="nm" data-i="${i}" value="${esc(r.sub)}" maxlength="12" placeholder="과목"><button class="x" data-a="delS" data-i="${i}" aria-label="삭제">${IC.x}</button><div class="sts"><div class="st"><button data-a="f-" data-i="${i}" aria-label="감소">−</button><span>집중 ${r.f}</span><button data-a="f+" data-i="${i}" aria-label="증가">+</button></div><div class="st"><button data-a="b-" data-i="${i}" aria-label="감소">−</button><span>휴식 ${r.b}</span><button data-a="b+" data-i="${i}" aria-label="증가">+</button></div></div></div>`).join('');
 const tf=d.plan.reduce((a,r)=>a+r.f,0),tb=d.plan.reduce((a,r)=>a+r.b,0);
 $('sum').textContent=d.plan.length?`집중 ${fmtM(tf)} · 휴식 ${fmtM(tb)}`:'';

 const mins=d.hist.reduce((a,h)=>a+h.min,0);
 $('n1').textContent=fmtM(mins);$('n2').textContent=d.hist.length;
 $('tc').textContent=d.tasks.length?`${d.tasks.length} task${d.tasks.length>1?'s':''}`:'';
 $('tasks').innerHTML=d.tasks.map((t,i)=>`<li class="${t.done?'dn':''}"><button class="ck" data-a="chk" data-i="${i}" aria-label="완료">${t.done?IC.ck:''}</button><span class="t">${esc(t.text)}</span><button class="tr2" data-a="delT" data-i="${i}" aria-label="삭제">${IC.tr}</button></li>`).join('');
 const hs=d.hist.slice().sort((a,b)=>a.at-b.at);
 $('hc').textContent=hs.length?hs.length+' total':'';
 $('hist').innerHTML=hs.map((x,i)=>[i,x]).reverse().map(([i,x])=>`<li><span class="ck hk">${IC.ck}</span><span class="t">Focus block ${i+1}${x.sub?` <span class="m">${esc(x.sub)}</span>`:''}</span><span class="m">${fmtT(x.at)}</span></li>`).join('');
 paint();renderPhotos();
}

/* 사진 (IndexedDB) */
const idb=new Promise(r=>{try{const q=indexedDB.open('sp-photos',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function pdb(mode,fn){const db=await idb;if(!db)return null;return new Promise(res=>{const t=db.transaction('p',mode),r=fn(t.objectStore('p'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>res(null)})}
let urls=[];
async function renderPhotos(){
 const all=(await pdb('readonly',s=>s.getAll()))||[],list=all.filter(p=>p.day===view);
 urls.forEach(URL.revokeObjectURL);urls=[];
 $('pc').textContent=`${list.length} photo${list.length===1?'':'s'}`;
 $('ph').innerHTML=list.map(p=>{const u=URL.createObjectURL(p.blob);urls.push(u);return `<div><img src="${u}" alt=""><button data-a="delP" data-id="${p.id}" aria-label="삭제">${IC.x}</button></div>`}).join('');
}
$('pf').addEventListener('change',async e=>{
 for(const f of e.target.files){if(f.size>12*1048576)continue;await pdb('readwrite',s=>s.put({id:Date.now()+'-'+Math.random().toString(36).slice(2),day:view,blob:f}))}
 e.target.value='';renderPhotos();
});

/* 이벤트 */
function addS(v){const d=D(view);d.plan.push({sub:v,f:S.fl,b:5});save();render()}
function addT(){const v=$('tk').value.trim();if(!v)return;D(view).tasks.push({text:v,done:false});$('tk').value='';save();render()}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;
 const a=el.dataset.a,i=+el.dataset.i,d=D(view),T=S.timer;
 if(a==='prev')view=shift(view,-1);
 else if(a==='next')view=shift(view,1);
 else if(a==='today')view=dayOf(Date.now());
 else if(a==='toggle')return toggle();
 else if(a==='skip')return skip();
 else if(a==='reset')return reset();
 else if(a==='mode'){if(d.plan.length||T.running)return;S.mode=el.dataset.v;T.rem=0;T.day=null}
 else if(a==='addS')return addS(el.dataset.v);
 else if(a==='addT')return addT();
 else if(a==='delS'){d.plan.splice(i,1);if(T.day===view)S.timer={day:null,idx:0,rem:0,running:false,endAt:0}}
 else if(a==='f-')d.plan[i].f=Math.max(5,d.plan[i].f-5);
 else if(a==='f+')d.plan[i].f=Math.min(180,d.plan[i].f+5);
 else if(a==='b-')d.plan[i].b=Math.max(0,d.plan[i].b-1);
 else if(a==='b+')d.plan[i].b=Math.min(60,d.plan[i].b+1);
 else if(a==='chk')d.tasks[i].done=!d.tasks[i].done;
 else if(a==='delT')d.tasks.splice(i,1);
 else if(a==='delP'){pdb('readwrite',s=>s.delete(el.dataset.id)).then(renderPhotos);return}
 save();render();
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.a==='nm'){D(view).plan[+el.dataset.i].sub=el.value;save()}
 else if(el.id==='fl'){const v=parseInt(el.value);if(v>0&&v<=180){S.fl=v;if(!S.timer.running){S.timer.rem=0}save();paint()}}
});
$('dp').addEventListener('change',e=>{if(e.target.value){view=e.target.value;render()}});
$('tk').addEventListener('keydown',e=>{if(e.key==='Enter')addT()});
setInterval(tick,250);document.addEventListener('visibilitychange',tick);
tick();render();
</script>
